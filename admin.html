
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAPT AUTOS | Admin Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090909;color:#eee;font-family:Arial,sans-serif}
header{background:#111;padding:18px 22px;border-bottom:1px solid #b18b42;display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}
header img{width:125px;max-height:65px;object-fit:contain}
h1,h2{color:#d6ad52}
header h2{margin:0;font-size:18px}
main{max-width:1100px;margin:30px auto;padding:15px}
.panel,.request{background:#151515;border:1px solid #393020;border-radius:10px;padding:20px;margin-bottom:20px}
input{width:100%;padding:13px;margin:8px 0 15px;background:#080808;color:white;border:1px solid #555;border-radius:6px}
label{color:#d6ad52}
button{border:0;padding:12px 17px;border-radius:6px;font-weight:bold;cursor:pointer;margin:5px 5px 5px 0}
.primary{background:#d6ad52;color:#111}
.reject{background:#642727;color:white}
.secondary{background:#333;color:white}
button:disabled{opacity:.5}
.hidden{display:none!important}
.muted{color:#aaa;line-height:1.5}
#message{margin:15px 0;line-height:1.5}
.request h3{color:#d6ad52;margin-top:0}
.details{line-height:1.8;overflow-wrap:anywhere}
.photos{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.photos img{width:130px;height:100px;object-fit:cover;border-radius:7px;border:1px solid #555}
.tag{display:inline-block;background:#342b18;color:#e5c36d;padding:5px 9px;border-radius:5px;font-size:12px}
footer{text-align:center;padding:25px;color:#888}
@media(max-width:550px){main{padding:10px}.panel,.request{padding:15px}header{padding:15px}}
</style>
</head>
<body>

<header>
<img src="capt-autos-logo.PNG" alt="CAPT AUTOS Logo">
<h2>ADMIN DASHBOARD</h2>
<button id="logoutButton" class="secondary hidden">Sign Out</button>
</header>

<main>
<section id="loginPanel" class="panel">
<h1>Admin Login</h1>
<p class="muted">Sign in to manage CAPT AUTOS customer requests.</p>
<form id="loginForm">
<label for="email">Email address</label>
<input id="email" type="email" required placeholder="Admin email">
<label for="password">Password</label>
<input id="password" type="password" required placeholder="Your password">
<button class="primary" type="submit">LOG IN</button>
</form>
</section>

<section id="dashboard" class="hidden">
<div class="panel">
<h1>Customer Requests</h1>
<p class="muted">Review each submission. Approving a request publishes the vehicle to the public inventory.</p>
<button id="refreshButton" class="secondary">Refresh Requests</button>
</div>
<div id="requests"></div>
</section>

<div id="message" role="status" aria-live="polite"></div>
</main>

<footer>CAPT AUTOS · Abuja, Nigeria</footer>

<script>
const SUPABASE_URL = "https://lcfsirumqiqphdwtmktp.supabase.co";
const SUPABASE_KEY = "sb_publishable_5kwR-5Ajh3KJmDWchcykGg_NeIz6S1g";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const loginPanel = document.getElementById("loginPanel");
const dashboard = document.getElementById("dashboard");
const requestsBox = document.getElementById("requests");
const message = document.getElementById("message");
const logoutButton = document.getElementById("logoutButton");

function showMessage(text, error = false) {
  message.textContent = text;
  message.style.color = error ? "#ff7777" : "#d6ad52";
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[char]);
}

async function checkSession() {
  const { data: { session } } = await db.auth.getSession();

  if (session) {
    await showDashboard();
  } else {
    loginPanel.classList.remove("hidden");
    dashboard.classList.add("hidden");
    logoutButton.classList.add("hidden");
  }
}

async function showDashboard() {
  const { data: { user } } = await db.auth.getUser();

  if (!user || user.app_metadata?.role !== "admin") {
    await db.auth.signOut();
    showMessage("Access denied. This account is not an administrator.", true);
    return;
  }

  loginPanel.classList.add("hidden");
  dashboard.classList.remove("hidden");
  logoutButton.classList.remove("hidden");

  await loadRequests();
}

document.getElementById("loginForm").addEventListener("submit", async event => {
  event.preventDefault();
  showMessage("Signing in...");

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  const { error } = await db.auth.signInWithPassword({ email, password });

  if (error) {
    showMessage("Login failed: " + error.message, true);
    return;
  }

  await showDashboard();
});

logoutButton.addEventListener("click", async () => {
  await db.auth.signOut();
  dashboard.classList.add("hidden");
  loginPanel.classList.remove("hidden");
  logoutButton.classList.add("hidden");
  requestsBox.innerHTML = "";
  showMessage("You have signed out.");
});

document.getElementById("refreshButton").addEventListener("click", loadRequests);

async function loadRequests() {
  requestsBox.innerHTML = "<p class='muted'>Loading requests...</p>";

  const { data, error } = await db
    .from("car_requests")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    requestsBox.innerHTML = "";
    showMessage("Could not load requests: " + error.message, true);
    return;
  }

  if (!data.length) {
    requestsBox.innerHTML = "<div class='panel'>No customer requests yet.</div>";
    return;
  }

  requestsBox.innerHTML = data.map(request => {
    const photos = (request.photo_urls || []).map(url =>
      `<a href="${escapeHTML(url)}" target="_blank" rel="noopener">
        <img src="${escapeHTML(url)}" alt="Customer vehicle photo">
      </a>`
    ).join("");

    const type = {
      sell: "Sell my car",
      swap: "Swap my car",
      valuation: "Vehicle valuation"
    }[request.request_type] || request.request_type;

    const isPending = request.status === "pending";

    return `
      <article class="request">
        <h3>${escapeHTML(request.brand)} ${escapeHTML(request.model)}</h3>
        <span class="tag">${escapeHTML(type)}</span>
        <span class="tag">${escapeHTML(request.status)}</span>

        <div class="details">
          <p><strong>Customer:</strong> ${escapeHTML(request.customer_name)}</p>
          <p><strong>Phone:</strong> ${escapeHTML(request.customer_phone)}</p>
          <p><strong>Year:</strong> ${escapeHTML(request.year || "Not supplied")}</p>
          <p><strong>Condition:</strong> ${escapeHTML(request.condition || "Not supplied")}</p>
          <p><strong>Location:</strong> ${escapeHTML(request.location)}</p>
          <p><strong>Expected price:</strong> ${request.expected_price == null ? "Not supplied" : "₦" + Number(request.expected_price).toLocaleString("en-NG")}</p>
          <p><strong>Wants in exchange:</strong> ${escapeHTML(request.wanted_car || "Not applicable")}</p>
          <p><strong>Description:</strong> ${escapeHTML(request.description || "No additional information")}</p>
          <p><strong>Submitted:</strong> ${escapeHTML(new Date(request.created_at).toLocaleString())}</p>
        </div>

        ${photos ? `<h4>Vehicle Photos</h4><div class="photos">${photos}</div>` : "<p class='muted'>No photos attached.</p>"}

        ${isPending ? `
          <button class="primary" data-action="approve" data-id="${escapeHTML(request.id)}">APPROVE & PUBLISH</button>
          <button class="reject" data-action="reject" data-id="${escapeHTML(request.id)}">REJECT REQUEST</button>
        ` : ""}
      </article>
    `;
  }).join("");
}

requestsBox.addEventListener("click", async event => {
  const button = event.target.closest("button[data-action]");
  if (!button) return;

  const requestId = button.dataset.id;
  const action = button.dataset.action;

  if (action === "approve") {
    if (!confirm("Approve this vehicle and publish it to the public inventory?")) return;

    button.disabled = true;
    showMessage("Approving and publishing vehicle...");

    const { error } = await db.rpc("approve_car_request", {
      p_request_id: requestId
    });

    if (error) {
      button.disabled = false;
      showMessage("Approval failed: " + error.message, true);
      return;
    }

    showMessage("Vehicle approved and published successfully!");
    await loadRequests();
  }

  if (action === "reject") {
    if (!confirm("Are you sure you want to reject this request?")) return;

    button.disabled = true;

    const { error } = await db
      .from("car_requests")
      .update({ status: "rejected", updated_at: new Date().toISOString() })
      .eq("id", requestId)
      .eq("status", "pending");

    if (error) {
      button.disabled = false;
      showMessage("Could not reject request: " + error.message, true);
      return;
    }

    showMessage("Request rejected.");
    await loadRequests();
  }
});

db.auth.onAuthStateChange((_event, session) => {
  if (!session) {
    loginPanel.classList.remove("hidden");
    dashboard.classList.add("hidden");
    logoutButton.classList.add("hidden");
  }
});

checkSession();
</script>
</body>
</html>
